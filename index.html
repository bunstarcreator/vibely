<section class="hero" aria-labelledby="hero-heading">

  <div class="hero-content">
    <div class="welcome">♡ Welcome to ♡</div>
    <h1 id="hero-heading">Vibely</h1>
    <div class="anime-ribbon" aria-hidden="true">✦ Your anime world ✦</div>
    <div class="hero-description">
      Find people, interests<br>
      and games you enjoy. ♡
    </div>
  </div>

  <!-- petals overlay -->
  <div class="petals" aria-hidden="true"></div>

  <!-- hero visual (character) — HOTLINKED to the image you provided -->
  <div class="hero-visual" aria-hidden="true">
    <img src="https://i.imgur.com/FaKsbL5.jpeg"
         alt="Anime character artwork"
         loading="lazy" />
  </div>

</section>

<div class="home-cards">

  <div class="feature-card">
    <div class="feature-icon" aria-hidden="true">👥</div>
    <div class="feature-text">
      <h2>People ♡</h2>
      <p>Discover people in your age range and make new friends.</p>
    </div>
    <button class="go-button" onclick="go('discover')">Go →</button>
  </div>

  <div class="feature-card">
    <div class="feature-icon" aria-hidden="true">💬</div>
    <div class="feature-text">
      <h2>Chat Rooms ♡</h2>
      <p>Join moderated group conversations and chat!</p>
    </div>
    <button class="go-button" onclick="go('chats')">Go →</button>
  </div>

  <div class="feature-card">
    <div class="feature-icon" aria-hidden="true">🎮</div>
    <div class="feature-text">
      <h2>Games ♡</h2>
      <p>Play fun games and compete with others!</p>
    </div>
    <button class="go-button" onclick="go('games')">Go →</button>
  </div>

</div>
